<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tết Trung Thu — Gửi Phương Anh</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Quicksand:wght@400;500;600&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- CSS File -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Three.js Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <!-- Màn hình chào mừng (Intro) -->
  <div id="intro-screen">
    <div class="intro-bg">
    <img id="introImg" src="images/anh1.png" alt="Tết Trung Thu">
      <div class="moon-glow"></div>
      <canvas id="introCanvas"></canvas>
    </div>
    
    <!-- Vùng cảm ứng khớp chính xác theo đường kính Mặt Trăng -->
    <div class="moon-hold" id="moonContainer"></div>
    <div class="instruction" id="instructionText">Nhấn giữ vào Mặt Trăng để mở món quà ✨</div>
  </div>

  <!-- Các thành phần hiển thị sau khi chuyển cảnh -->
  <div id="corner-label">Trung Thu An Lành 🌕</div>
  <div id="hint">✨ Chạm vuốt để xoay không gian ✨</div>

  <div id="action-icons">
    <div class="icon-btn" id="soundBtn">🔈</div>
    <div class="icon-btn" id="envelopeBtn">💌</div>
  </div>

  <!-- Khung bức thư -->
  <div id="letter-overlay">
    <div class="letter-card">
      <div class="letter-inner"></div>
      <div class="letter-close" id="letterClose">✕</div>
      <div class="letter-text" id="letterText"></div>
    </div>
  </div>

  <!-- Canvas chứa không gian 3D -->
  <canvas id="canvas3d"></canvas>
  <audio id="bgMusic" loop preload="auto"></audio>

  <!-- JavaScript File -->
  <script src="script.js"></script>
</body>
</html>
